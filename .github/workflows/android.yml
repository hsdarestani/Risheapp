name: Build Rishe Android APKs

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build test APKs
        run: gradle -p android --no-daemon assembleDebug

      - name: Restore release signing key
        if: env.ANDROID_KEYSTORE_B64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/rishe-release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/rishe-release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APKs
        if: env.ANDROID_KEYSTORE_B64 != ''
        run: gradle -p android --no-daemon assembleRelease

      - name: Upload main Rishe test APK
        uses: actions/upload-artifact@v4
        with:
          name: rishe-android-test
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Event Rishe test APK
        uses: actions/upload-artifact@v4
        with:
          name: event-rishe-android-test
          path: android/eventapp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload main Rishe release APK
        if: env.ANDROID_KEYSTORE_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: rishe-bazaar-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload Event Rishe release APK
        if: env.ANDROID_KEYSTORE_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: event-rishe-release
          path: android/eventapp/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90
