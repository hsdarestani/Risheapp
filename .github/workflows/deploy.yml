name: Deploy Rishe App

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: risheapp-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build application
        id: build
        continue-on-error: true
        run: npm run build > build.log 2>&1
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
      - name: Surface build failure
        if: steps.build.outcome == 'failure'
        run: |
          cat build.log
          exit 1

  deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[deploy]'))
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH client helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
      - name: Deploy over SSH
        id: deploy
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          set +e
          sshpass -p "$PASS" ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            root@"$HOST" 'bash -s' > deploy.log 2>&1 <<'REMOTE'
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          if ! command -v git >/dev/null 2>&1; then
            apt-get update && apt-get install -y git ca-certificates curl
          fi
          if ! command -v docker >/dev/null 2>&1; then
            curl -fsSL https://get.docker.com | sh
          fi
          mkdir -p /opt/risheapp
          if [ ! -d /opt/risheapp/.git ]; then
            rm -rf /opt/risheapp
            git clone https://github.com/hsdarestani/Risheapp.git /opt/risheapp
          else
            cd /opt/risheapp
            git fetch origin main
            git reset --hard origin/main
          fi
          cd /opt/risheapp
          docker compose up -d --build --remove-orphans
          docker image prune -f
          if command -v ufw >/dev/null 2>&1; then
            ufw allow 80/tcp || true
          fi
          sleep 8
          curl -fsS http://127.0.0.1/api/health
          docker compose ps
          REMOTE
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat deploy.log
          exit 0
      - name: Upload deployment log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-log
          path: deploy.log
          if-no-files-found: ignore
      - name: Surface deployment failure
        if: steps.deploy.outputs.exit_code != '0'
        run: exit 1
