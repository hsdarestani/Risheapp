name: Deploy Rishe App

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: risheapp-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            export DEBIAN_FRONTEND=noninteractive
            if ! command -v git >/dev/null 2>&1; then
              apt-get update && apt-get install -y git ca-certificates curl
            fi
            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com | sh
            fi
            mkdir -p /opt/risheapp
            if [ ! -d /opt/risheapp/.git ]; then
              rm -rf /opt/risheapp/*
              git clone https://github.com/hsdarestani/Risheapp.git /opt/risheapp
            else
              cd /opt/risheapp
              git fetch origin main
              git reset --hard origin/main
            fi
            cd /opt/risheapp
            docker compose up -d --build --remove-orphans
            docker image prune -f
            sleep 8
            curl -fsS http://127.0.0.1/api/health
