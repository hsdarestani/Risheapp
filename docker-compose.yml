services:
  risheapp:
    build: .
    container_name: risheapp
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      WOOCOMMERCE_URL: "${WOOCOMMERCE_URL:-https://rishe.store}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      DATA_DIR: /app/data
    volumes:
      - risheapp_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    container_name: risheapp-caddy
    restart: unless-stopped
    depends_on:
      risheapp:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  risheapp_data:
  caddy_data:
  caddy_config:
