services:
  risheapp:
    build: .
    container_name: risheapp
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:3000"
    environment:
      WOOCOMMERCE_URL: "${WOOCOMMERCE_URL:-https://rishe.store}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      DATA_DIR: /app/data
    volumes:
      - risheapp_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  risheapp_data:
