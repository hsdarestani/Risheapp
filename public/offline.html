<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#8acb39" />
    <title>ریشه آفلاین است</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4eee7;color:#35349a;font-family:Tahoma,Arial,sans-serif;text-align:center}.card{max-width:430px;background:#fffaf3;border:2px solid #35349a;border-radius:28px;padding:34px 26px;box-shadow:8px 8px 0 #8acb39}.icon{font-size:56px}.title{font-size:28px;margin:12px 0}.text{font-size:16px;line-height:1.9;color:#333}.button{display:inline-block;margin-top:18px;border:0;border-radius:16px;background:#35349a;color:white;padding:13px 22px;font:inherit;font-weight:700;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon">🚜</div>
      <h1 class="title">فعلاً راه مزرعه بسته‌ست!</h1>
      <p class="text">اتصال اینترنت را بررسی کن و دوباره تلاش کن. بخش‌هایی که قبلاً دیده‌ای همچنان داخل اپ قابل استفاده‌اند.</p>
      <button class="button" onclick="location.reload()">دوباره تلاش کن</button>
    </main>
  </body>
</html>
