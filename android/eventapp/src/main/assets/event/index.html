<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173c2f">
<title>ایونت ریشه</title>
<style>
:root{--green:#173c2f;--green2:#245943;--cream:#f4f2e9;--card:#fff;--line:#ded9cb;--red:#b42318;--text:#193128;--muted:#708078}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--cream);color:var(--text);font-family:Tahoma,Arial,sans-serif}button,input,select{font:inherit}.shell{max-width:760px;margin:auto;padding:18px 16px 110px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:10px}.logo{width:46px;height:46px;border-radius:15px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:25px;font-weight:900}.brand strong{display:block;font-size:19px}.brand small{color:var(--muted)}.status{display:flex;align-items:center;gap:7px;background:#fff;padding:9px 11px;border:1px solid var(--line);border-radius:14px;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:#999}.dot.on{background:#26945b}.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 8px 25px rgba(23,60,47,.05)}.eventrow{display:grid;grid-template-columns:1fr;gap:10px}.eventrow label,.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}input,select{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 12px;outline:none;color:var(--text)}input:focus,select:focus{border-color:var(--green)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.search{margin-top:10px}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.product{border:1px solid var(--line);border-radius:17px;padding:13px;background:#fbfbf8;display:flex;flex-direction:column;gap:8px;min-height:120px}.product strong{font-size:14px}.product small{color:var(--muted);line-height:1.8}.product button{margin-top:auto;border:0;border-radius:12px;background:var(--green);color:#fff;height:38px;font-weight:800}.product button:disabled{opacity:.35}.cartline{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px dashed var(--line)}.cartline:last-child{border-bottom:0}.qty{display:flex;align-items:center;gap:8px}.qty button{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:10px;font-weight:900}.summary{display:grid;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.sumrow{display:flex;justify-content:space-between;align-items:center;gap:10px}.total{font-size:18px;font-weight:900}.submit{position:fixed;bottom:16px;left:16px;right:16px;max-width:728px;margin:auto;border:0;background:var(--green);color:#fff;border-radius:18px;padding:16px;font-weight:900;font-size:17px;box-shadow:0 12px 30px rgba(23,60,47,.25);z-index:20}.submit:disabled{opacity:.45}.empty{text-align:center;color:var(--muted);padding:25px 8px}.pending{font-size:12px;color:var(--muted);margin-top:6px}.syncbtn{border:0;background:transparent;color:var(--green);font-weight:800;padding:0}.login{position:fixed;inset:0;background:var(--cream);z-index:100;display:grid;place-items:center;padding:20px}.loginbox{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:26px;padding:24px;box-shadow:0 15px 45px rgba(23,60,47,.12)}.loginbox h1{margin:0 0 5px}.loginbox p{margin:0 0 20px;color:var(--muted);font-size:13px;line-height:1.9}.loginbox input{margin-bottom:10px}.loginbox button{width:100%;border:0;background:var(--green);color:#fff;border-radius:14px;padding:14px;font-weight:900}.error{color:var(--red);font-size:13px;margin:10px 0}.toast{position:fixed;top:18px;left:18px;right:18px;max-width:620px;margin:auto;background:#173c2f;color:#fff;padding:12px 15px;border-radius:14px;z-index:200;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.18)}.toast.bad{background:var(--red)}@media(max-width:540px){.grid2{grid-template-columns:1fr}.products{grid-template-columns:1fr 1fr}.shell{padding-left:12px;padding-right:12px}.panel{padding:14px}.product{padding:11px}.head{align-items:flex-start}.status{max-width:160px;flex-wrap:wrap;justify-content:flex-end}}@media(max-width:380px){.products{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login" class="login" hidden>
  <form id="loginForm" class="loginbox">
    <div class="brand" style="margin-bottom:18px"><div class="logo">ر</div><div><strong>ایونت ریشه</strong><small>ورود فروشنده</small></div></div>
    <h1>ورود اولیه</h1><p>فقط بار اول به اینترنت نیاز است. رمز عبور روی گوشی ذخیره نمی‌شود.</p>
    <input id="username" autocomplete="username" placeholder="نام کاربری" required>
    <input id="password" type="password" autocomplete="current-password" placeholder="رمز عبور" required>
    <div id="loginError" class="error" hidden></div>
    <button id="loginButton" type="submit">ورود به فروش ایونت</button>
  </form>
</div>
<div class="shell">
  <div class="head"><div class="brand"><div class="logo">ر</div><div><strong>فروش ایونت ریشه</strong><small id="seller">فروشنده</small></div></div><div class="status"><span id="dot" class="dot"></span><span id="network">در حال بررسی</span><button id="syncButton" class="syncbtn" type="button">سینک</button></div></div>
  <section class="panel eventrow"><div class="field"><label>ایونت فعال</label><select id="event"><option value="">انتخاب ایونت</option></select></div><div id="pending" class="pending">در انتظار ارسال: ۰</div></section>
  <section class="panel"><div class="grid2"><div class="field"><label>نام مشتری *</label><input id="customerName" placeholder="نام مشتری"></div><div class="field"><label>موبایل مشتری</label><input id="customerMobile" inputmode="tel" placeholder="اختیاری"></div></div><div class="search"><input id="search" placeholder="جست‌وجوی کالا یا بارکد"></div><div id="products" class="products"><div class="empty">ابتدا ایونت را انتخاب کنید.</div></div></section>
  <section class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><strong>سبد فروش</strong><small id="cartCount">۰ قلم</small></div><div id="cart"><div class="empty">هنوز کالایی اضافه نشده.</div></div><div class="summary"><div class="sumrow"><span>جمع کالاها</span><strong id="subtotal">۰ تومان</strong></div><div class="sumrow total"><span>مبلغ نهایی</span><strong id="total">۰ تومان</strong></div><div class="grid2"><div class="field"><label>مبلغ پرداختی (تومان)</label><input id="paid" type="number" min="0" inputmode="numeric"></div><div class="field"><label>روش پرداخت</label><select id="payment"><option value="pos">کارت‌خوان</option><option value="cash">نقدی</option><option value="card">کارت‌به‌کارت</option></select></div></div></div></section>
</div>
<button id="submit" class="submit" type="button" disabled>ثبت فروش</button>
<div id="toast" class="toast" hidden></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), fmt=v=>new Intl.NumberFormat('fa-IR').format(Math.round(Number(v||0))), toman=v=>`${fmt(Number(v||0)/10)} تومان`, esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let db,bootstrap={events:[]},catalog=[],currentEvent=0,cart=new Map(),paidTouched=false;const pendingNative=new Map();
function toast(text,bad=false){const el=$('toast');el.textContent=text;el.className='toast'+(bad?' bad':'');el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,3500)}
function nativeCall(kind,...args){return new Promise((resolve,reject)=>{const id=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random());pendingNative.set(id,{resolve,reject});try{AndroidApi[kind](id,...args)}catch(e){pendingNative.delete(id);reject(e)}})}
window.__nativeResult=(id,ok,status,payload)=>{const p=pendingNative.get(id);if(!p)return;pendingNative.delete(id);let data={};try{data=payload?JSON.parse(payload):{}}catch{};if(ok){p.resolve(data)}else{const e=new Error(data.message||data.error||`خطای ${status||0}`);e.status=Number(status||0);p.reject(e)}};
async function api(path,method='GET',data=null){return nativeCall('request',method,path,data?JSON.stringify(data):'')}
function showLogin(message=''){const el=$('login');el.hidden=false;$('loginError').hidden=!message;$('loginError').textContent=message;$('password').value='';}
function hideLogin(){$('login').hidden=true;$('loginError').hidden=true}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();if(!navigator.onLine)return showLogin('برای ورود اولیه اینترنت را وصل کنید.');const b=$('loginButton');b.disabled=true;b.textContent='در حال ورود…';try{await nativeCall('login',$('username').value.trim(),$('password').value);hideLogin();await startOnline()}catch(err){showLogin(err.message||'ورود انجام نشد.')}finally{b.disabled=false;b.textContent='ورود به فروش ایونت'}});
function openDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open('event-rishe-native',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('queue'))r.result.createObjectStore('queue',{keyPath:'client_uuid'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function store(mode='readonly'){return db.transaction('queue',mode).objectStore('queue')}function queueAll(){return new Promise((res,rej)=>{const r=store().getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}function queuePut(v){return new Promise((res,rej)=>{const r=store('readwrite').put(v);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}function queueDelete(id){return new Promise((res,rej)=>{const r=store('readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function networkState(){const on=navigator.onLine;$('dot').classList.toggle('on',on);$('network').textContent=on?'آنلاین':'آفلاین'}
async function updatePending(){const rows=await queueAll().catch(()=>[]);$('pending').textContent=`در انتظار ارسال: ${fmt(rows.length)}`;return rows}
function renderEvents(){const s=$('event'),last=+(localStorage.getItem('event-rishe-id')||0);$('seller').textContent=bootstrap.user?.name||'فروشنده';s.innerHTML='<option value="">انتخاب ایونت</option>'+bootstrap.events.map(e=>`<option value="${e.id}">${esc(e.name)}${e.location?' — '+esc(e.location):''}</option>`).join('');if(bootstrap.events.some(e=>+e.id===last)){s.value=last;currentEvent=last;loadCatalog(last)}else if(bootstrap.events.length===1){s.value=bootstrap.events[0].id;currentEvent=+s.value;localStorage.setItem('event-rishe-id',currentEvent);loadCatalog(currentEvent)}}
async function loadBootstrap(){if(navigator.onLine){try{bootstrap=await api('/bootstrap');localStorage.setItem('event-rishe-bootstrap',JSON.stringify(bootstrap));renderEvents();return}catch(e){if(e.status===401||e.status===403){AndroidApi.logout();showLogin('نشست ورود منقضی شده؛ دوباره وارد شوید.');return}toast('ارتباط با سرور برقرار نشد؛ داده آفلاین نمایش داده می‌شود.',true)}}const c=localStorage.getItem('event-rishe-bootstrap');if(c){try{bootstrap=JSON.parse(c);renderEvents()}catch{}}else toast('برای اولین راه‌اندازی اینترنت لازم است.',true)}
async function loadCatalog(id){currentEvent=+id;cart.clear();renderCart();if(!currentEvent){catalog=[];renderProducts();return}localStorage.setItem('event-rishe-id',currentEvent);const key=`event-rishe-catalog-${currentEvent}`;if(navigator.onLine){try{const d=await api(`/events/${currentEvent}/catalog`);catalog=d.products||[];localStorage.setItem(key,JSON.stringify(d));renderProducts();return}catch(e){if(e.status===401){AndroidApi.logout();showLogin('دوباره وارد شوید.');return}toast('کالاها از حافظه آفلاین خوانده می‌شوند.',true)}}const c=localStorage.getItem(key);if(c){try{catalog=JSON.parse(c).products||[];renderProducts()}catch{catalog=[];renderProducts()}}else{catalog=[];renderProducts();toast('فهرست این ایونت هنوز روی گوشی ذخیره نشده.',true)}}
function renderProducts(){const q=$('search').value.trim().toLowerCase(),rows=catalog.filter(p=>!q||`${p.name} ${p.sku||''}`.toLowerCase().includes(q));$('products').innerHTML=rows.length?rows.map(p=>`<div class="product"><strong>${esc(p.name)}</strong><small>${toman(p.price_irr)}<br>موجودی: ${fmt(p.available)}</small><button data-add="${p.wc_product_id}" ${Number(p.available)<=0?'disabled':''}>افزودن</button></div>`).join(''):'<div class="empty">کالایی پیدا نشد.</div>'}
function totals(){let subtotal=0;cart.forEach(i=>subtotal+=i.quantity*i.unit_price_irr);return{subtotal,total:subtotal}}
function renderCart(){const rows=[...cart.values()];$('cartCount').textContent=`${fmt(rows.reduce((a,x)=>a+x.quantity,0))} قلم`;$('cart').innerHTML=rows.length?rows.map(i=>`<div class="cartline"><div><strong>${esc(i.name)}</strong><div class="pending">${toman(i.quantity*i.unit_price_irr)}</div></div><div class="qty"><button data-minus="${i.wc_product_id}">−</button><b>${fmt(i.quantity)}</b><button data-plus="${i.wc_product_id}">+</button></div></div>`).join(''):'<div class="empty">هنوز کالایی اضافه نشده.</div>';const t=totals();$('subtotal').textContent=toman(t.subtotal);$('total').textContent=toman(t.total);if(!paidTouched)$('paid').value=Math.round(t.total/10);$('submit').disabled=!rows.length||!currentEvent}
function add(id,delta=1){const p=catalog.find(x=>+x.wc_product_id===+id);if(!p)return;const i=cart.get(+id)||{...p,quantity:0,unit_price_irr:+p.price_irr};i.quantity=Math.max(0,i.quantity+delta);if(i.quantity>Number(p.available))return toast('موجودی کافی نیست.',true);i.quantity?cart.set(+id,i):cart.delete(+id);renderCart()}
$('products').addEventListener('click',e=>{const b=e.target.closest('[data-add]');if(b)add(b.dataset.add)});$('cart').addEventListener('click',e=>{const p=e.target.closest('[data-plus]'),m=e.target.closest('[data-minus]');if(p)add(p.dataset.plus);if(m)add(m.dataset.minus,-1)});$('search').addEventListener('input',renderProducts);$('paid').addEventListener('input',()=>paidTouched=true);$('event').addEventListener('change',e=>loadCatalog(+e.target.value));
function uuid(){return crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0,v=c==='x'?r:(r&3|8);return v.toString(16)})}function now(){return new Date().toISOString().slice(0,19).replace('T',' ')}
$('submit').addEventListener('click',async()=>{const name=$('customerName').value.trim(),mobile=$('customerMobile').value.replace(/\D/g,''),t=totals(),paid=Math.max(0,+$('paid').value||0)*10;if(!name)return toast('نام مشتری الزامی است.',true);if(mobile&&!/^(?:98|0098|0)?9\d{9}$/.test(mobile))return toast('شماره موبایل معتبر نیست.',true);if(paid>t.total)return toast('مبلغ پرداختی از مبلغ نهایی بیشتر است.',true);const sale={client_uuid:uuid(),event_id:currentEvent,customer_name:name,customer_mobile:mobile,discount_irr:0,paid_irr:paid,payment_method:$('payment').value,occurred_at:now(),created_offline_at:new Date().toISOString(),lines:[...cart.values()].map(i=>({wc_product_id:i.wc_product_id,variation_id:i.variation_id||0,quantity:i.quantity})),local_total_irr:t.total,status:'pending_sync',retry_count:0,error_message:'',last_attempt_at:null};await queuePut(sale);cart.clear();$('customerName').value='';$('customerMobile').value='';paidTouched=false;renderCart();await updatePending();toast(navigator.onLine?'فروش ذخیره شد؛ در حال ارسال…':'فروش آفلاین روی گوشی ذخیره شد.');if(navigator.onLine)syncQueue()});
async function syncQueue(){if(!navigator.onLine)return;const rows=await queueAll();if(!rows.length)return;try{const r=await api('/sync','POST',{sales:rows});for(const s of r.synced||[])await queueDelete(s.client_uuid);for(const f of r.failed||[]){const row=rows.find(x=>x.client_uuid===f.client_uuid);if(row){row.status='sync_failed';row.error_message=f.message||'';row.retry_count=(+row.retry_count||0)+1;await queuePut(row)}}if((r.synced||[]).length)toast(`${fmt(r.synced.length)} فروش ارسال شد.`);if((r.failed||[]).length)toast(`${fmt(r.failed.length)} فروش برای تلاش مجدد نگه داشته شد.`,true);await updatePending();if(currentEvent)loadCatalog(currentEvent)}catch(e){if(e.status===401||e.status===403){AndroidApi.logout();showLogin('برای ادامه سینک دوباره وارد شوید.')}else toast('ارسال انجام نشد؛ فروش‌ها روی گوشی محفوظ هستند.',true)}}
$('syncButton').addEventListener('click',syncQueue);window.addEventListener('online',()=>{networkState();loadBootstrap();syncQueue()});window.addEventListener('offline',networkState);
async function startOnline(){await loadBootstrap();await updatePending();if(navigator.onLine)syncQueue()}
(async()=>{db=await openDb();networkState();renderCart();await updatePending();if(!AndroidApi.hasSession()){showLogin();return}hideLogin();await startOnline();setInterval(()=>{if(navigator.onLine)syncQueue()},30000)})().catch(e=>toast(e.message||'خطای برنامه',true));
})();
</script>
</body>
</html>
